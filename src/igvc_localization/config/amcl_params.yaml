amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: scan
    laser_max_range: 20.0
    laser_min_range: 0.15
    max_particle: 2000
    main_particle: 500
    update_min_a: 0.2
    update_min_d: 0.2
    resample-interval: 1
    transform_tolerance: 1.0
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: True
    autostart: True
    node_names: ["map_server","amcl"]